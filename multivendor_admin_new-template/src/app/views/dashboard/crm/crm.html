<div class="container-fluid">
  <app-page-breadcrumb title="CRM" subTitle="Dashboard" />

  <div class="row">
    @for (item of crmStatData; track $index) {
    <div class="col-md-6 col-xxl-3">
      <app-crm-stat [item]="item" [index]="$index" />
    </div>
    }
  </div>

  <div class="row">
    <div class="col-xl-8">
      <app-overview />
    </div>

    <div class="col-xl-4">
      <app-lead-source />
    </div>
  </div>

  <div class="row">
    <div class="col-xl-12">
      <app-deal-status />
    </div>
  </div>

  <div class="row">
    <div class="col-xl-4 col-lg-12">
      <app-top-performing />
    </div>

    <div class="col-xl-4 col-lg-6">
      <app-location-session />
    </div>

    <div class="col-xl-4 col-lg-6">
      <app-recent-activity />
    </div>
  </div>
</div>
