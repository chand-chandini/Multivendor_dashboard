<div class="container-fluid">
  <app-page-breadcrumb title="eCommerce" subTitle="Dashboard" />

  <div class="row">
    <div class="col-xxl-5">
      <div class="row h-100">
        <div class="col-lg-3 col-md-6 col-xxl-6">
          <div class="card card-h-100 overflow-hidden">
            <div class="card-body pb-0">
              <div class="d-flex align-items-center justify-content-between mb-2">
                <div class="overflow-hidden flex-shrink-0">
                  <h3 class="fw-normal text-reset fs-20 lh-base">
                    <span class="text-muted fs-base text-uppercase h5">Good Day,</span> <br />
                    <b>{{ username }}!</b>
                  </h3>
                </div>
                <div class="flex-grow-1 text-end">
                  <img class="d-none d-xxl-inline-block" src="assets/images/svg/email-campaign.svg" width="110" alt="Generic placeholder image" />
                </div>
              </div>
            </div>
            <div class="card-body d-flex align-items-center p-2 bg-light bg-opacity-50">
              <p class="d-flex align-items-center justify-content-between w-100 mb-0">
                <span class="me-2"><app-icon icon="calendar" class="fs-15 align-middle"></app-icon> <span class="align-middle ms-1 fw-semibold"> {{ currentDate }} </span></span>
                <span class="text-nowrap"><app-icon icon="clock" class="fs-15 align-middle"></app-icon><span class="align-middle ms-1 fw-semibold">{{ time() }}</span></span>
              </p>
            </div>
            <!-- end card-body -->
          </div>
        </div>
        @for(state of stateData; track $index){
        <div class="col-lg-3 col-md-6 col-xxl-6">
          <app-ecommerce-stat [state]="state" />
        </div>
        }
      </div>
    </div>

    <div class="col-xxl-7">
      <div class="row h-100">
        <div class="col-lg-6">
          <app-store-performance />
        </div>

        <div class="col-lg-6">
          <app-weekly-performance />
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-xxl-6">
      <app-sales-report />
    </div>

    <div class="col-xxl-6">
      <app-top-selling-products />
    </div>
  </div>

  <div class="row">
    <div class="col-xxl-5">
      <app-recent-orders />
    </div>

    <div class="col-xxl-7">
      <div class="row">
        <div class="col-lg-6">
          <app-locations />
        </div>

        <div class="col-lg-6">
          <app-recent-activity />
        </div>
      </div>
    </div>
  </div>
</div>
