<div class="card">
  <div class="card-body">
    <iconify-icon [icon]="card.icon" [ngClass]="card.className" class="fs-36"></iconify-icon>

    <h3 class="fw-bold mt-3 mb-1">
      <span
        [countUp]="card.value"
        [countUpOptions]="{
          prefix: card.prefix,
          suffix: card.suffix,
          decimalPlaces: Number.isInteger(card.value) ? 0 : 2
        }"
      ></span>
    </h3>

    <p class="text-muted">{{ card.title }}</p>

    <span
      class="badge fs-12"
      [class]="{
        'badge-soft-success': card.change > 0,
        'badge-soft-danger': card.change < 0
      }"
    >
      @if(card.change >= 0){
      <iconify-icon icon="tabler:arrow-badge-up"></iconify-icon>
      } @else {
      <iconify-icon icon="tabler:arrow-badge-down"></iconify-icon>
      } {{ card.change }}%
    </span>

    <div class="mt-3"></div>
    @if(card.chartOptions){
    <app-apexchart [getOptions]="card.chartOptions" />
    }
  </div>
</div>
