<div class="card bg-secondary bg-gradient">
  <div class="card-body" style="background-image: url(assets/images/flower-style.svg); background-size: contain; background-repeat: no-repeat; background-position: right bottom">
    <h4 class="text-white">Investment Growth</h4>
    <p class="text-white text-opacity-75">Track performance and see where your money is heading.</p>
    <a [routerLink]="[]" class="btn btn-sm rounded-pill btn-info bg-gradient">View Portfolio</a>
  </div>
  <!-- end card-body-->
</div>
<div class="card">
  <div class="card-header justify-content-between">
    <h4 class="card-title">
      Quick Transfer
      <iconify-icon icon="tabler:info-octagon" class="text-muted ms-1" ngbTooltip="Quickly send money to your saved contacts." placement="top"></iconify-icon>
    </h4>
    <div ngbDropdown class="ms-auto">
      <a [routerLink]="[]" class="btn btn-sm btn-default btn-icon drop-arrow-none" ngbDropdownToggle>
        <app-icon icon="dots-vertical" class="fs-lg"></app-icon>
      </a>
      <div ngbDropdownMenu class="dropdown-menu-end">
        <a [routerLink]="[]" ngbDropdownItem> <iconify-icon icon="tabler:user-plus" class="me-2"></iconify-icon> Add Recipient </a>
        <a [routerLink]="[]" ngbDropdownItem> <iconify-icon icon="tabler:history" class="me-2"></iconify-icon> Recent Transfers </a>
        <a [routerLink]="[]" ngbDropdownItem> <iconify-icon icon="tabler:download" class="me-2"></iconify-icon> Export Transfers </a>
        <a [routerLink]="[]" ngbDropdownItem class="text-danger"> <iconify-icon icon="tabler:trash" class="me-2"></iconify-icon> Remove All </a>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="d-flex gap-2 justify-content-center">
      @for (item of userData; track $index) {

      <input type="radio" class="btn-check" name="recipient" [id]="item.id" autocomplete="off" [checked]="$index === 0" />

      <label class="avatar-label" [for]="item.id" [ngbTooltip]="item.name">
        <img [src]="item.image" alt="" class="rounded-circle img-thumbnail avatar-lg" />
      </label>

      }
    </div>

    <div class="my-3">
      <label for="sendFrom" class="form-label">Send From</label>
      <select id="sendFrom" class="form-select">
        <option value="visa">Visa •••• 3698</option>
        <option value="mastercard">Mastercard •••• 1425</option>
        <option value="paypal">PayPal Wallet</option>
      </select>
    </div>

    <div class="row g-3 mb-2">
      <div class="col-12 col-md-6">
        <label for="currency" class="form-label">Currency</label>
        <select id="currency" class="form-select">
          <option value="USD">$ USD — US Dollar</option>
          <option value="EUR">€ EUR — Euro</option>
          <option value="GBP">£ GBP — British Pound</option>
          <option value="INR">₹ INR — Indian Rupee</option>
        </select>
      </div>

      <div class="col-12 col-md-6">
        <label for="enterAmount" class="form-label">Amount</label>
        <input type="number" id="enterAmount" class="form-control" placeholder="0.00" min="1" step="0.01" />
      </div>
    </div>

    <div class="row g-2 mt-3">
      <div class="col">
        <a [routerLink]="[]" class="btn btn-primary w-100">Send Money</a>
      </div>
      <div class="col">
        <a [routerLink]="[]" class="btn btn-outline-secondary w-100">Save as Draft</a>
      </div>
    </div>
  </div>
</div>
