<div class="card">
  <div class="card-header justify-content-between">
    <h4 class="card-title">
      User Geography Intelligence
      <span ngbTooltip="Deep insight into user distribution across the globe."><app-icon icon="info-circle" class="text-muted ms-1"></app-icon></span>
    </h4>
    <div ngbDropdown class="ms-auto">
      <a [routerLink]="[]" class="btn btn-sm btn-default btn-icon drop-arrow-none" ngbDropdownToggle>
        <app-icon icon="dots-vertical" class="fs-lg"></app-icon>
      </a>
      <ul ngbDropdownMenu class="dropdown-menu-end">
        <li>
          <a ngbDropdownItem [routerLink]="[]"><app-icon icon="map" class="me-2"></app-icon> Open Geo Visualization</a>
        </li>
        <li>
          <a ngbDropdownItem [routerLink]="[]"><app-icon icon="download" class="me-2"></app-icon> Export Geo Metrics</a>
        </li>
        <li>
          <a ngbDropdownItem [routerLink]="[]"><app-icon icon="filter-2" class="me-2"></app-icon> Country Filters</a>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <a ngbDropdownItem class="text-danger" [routerLink]="[]"><app-icon icon="trash" class="me-2"></app-icon> Remove Widget</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="card-body pt-0">
    <div class="row align-items-center">
      <div class="col-lg-7">
        <app-vector-map [options]="getSessionByCountryChartOptions()" height="300px" />
      </div>
      <div class="col-lg-5" dir="ltr">
        <div class="p-3">
          @for(country of countryData; track $index; let last = $last){

          <div class="d-flex justify-content-between align-items-center">
            <p class="mb-1">
              <img [src]="country.image" alt="user-image" class="me-1 rounded-circle" height="20" />
              <span class="align-middle"> {{ country.name }}</span>
            </p>
            <div>
              <h5 class="fw-semibold mb-0">{{ country.value }}k</h5>
            </div>
          </div>

          <div class="row align-items-center {{!last ? 'mb-3' : ''}}">
            <div class="col">
              <ngb-progressbar [type]="country.variant" [value]="country.progress" [max]="100" class="progress-soft progress-sm"></ngb-progressbar>
            </div>
            <div class="col-auto">
              <p class="mb-0 text-muted fs-13">{{ country.progress }}%</p>
            </div>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
