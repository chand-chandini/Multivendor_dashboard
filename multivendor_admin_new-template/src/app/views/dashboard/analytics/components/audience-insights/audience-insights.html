<div class="card card-h-100">
  <div class="card-header justify-content-between">
    <h4 class="card-title">Audience Insights</h4>
    <div ngbDropdown class="ms-auto">
      <a [routerLink]="[]" class="btn btn-sm btn-default btn-icon drop-arrow-none" ngbDropdownToggle>
        <app-icon icon="dots-vertical" class="fs-lg"></app-icon>
      </a>
      <ul ngbDropdownMenu class="dropdown-menu-end">
        <li>
          <a ngbDropdownItem [routerLink]="[]"> <app-icon icon="chart-bar" class="me-2"></app-icon> View Detailed Report </a>
        </li>
        <li>
          <a ngbDropdownItem [routerLink]="[]"> <app-icon icon="download" class="me-2"></app-icon> Export Analytics </a>
        </li>
        <li>
          <a ngbDropdownItem [routerLink]="[]"> <app-icon icon="filter-2" class="me-2"></app-icon> Apply Filters </a>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <a ngbDropdownItem class="text-danger" [routerLink]="[]"> <app-icon icon="trash" class="me-2"></app-icon> Remove Widget </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="card-body p-0">
    <div class="row g-0">
      <div class="col">
        <div class="border-bottom p-2 border-end border-dashed">
          <h3 class="mb-0 d-flex gap-2 align-items-center justify-content-center">
            <app-icon icon="users"></app-icon>
            <span [countUp]="activeUsers"></span>
          </h3>
        </div>
      </div>
      <div class="col">
        <div class="border-bottom p-2 border-end border-dashed">
          <h3 class="mb-0 d-flex gap-2 align-items-center justify-content-center">
            <app-icon icon="device-analytics"></app-icon>
            <span [countUp]="activeViews"></span>
          </h3>
        </div>
      </div>
    </div>
    <!-- end row-->
  </div>

  <div class="card-body">
    <div dir="ltr">
      <app-apexchart class="apex-charts" [getOptions]="totalUserChart" />
    </div>

    <div class="table-responsive mt-2">
      <table class="table table-sm table-nowrap table-borderless table-centered mb-0">
        <thead class="bg-light bg-opacity-50 thead-sm">
          <tr class="text-uppercase fs-xxs">
            <th>Page</th>
            <th>Views</th>
            <th>B. Rate</th>
          </tr>
        </thead>
        <tbody>
          @for(item of insightData; track $index){
          <tr>
            <td>
              <a [routerLink]="[]" class="text-muted">{{ item.pageLink }}</a>
            </td>
            <td>{{ item.views }}</td>
            <td>{{ item.rate }}%</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
    <!-- end .table-responsive-->
    <div class="text-center mt-2">
      <a [routerLink]="[]" class="btn btn-sm btn-secondary">View All <app-icon icon="arrow-right" class="ms-1"></app-icon></a>
    </div>
  </div>
  <!-- end card-body-->
</div>
<!-- end card-->
