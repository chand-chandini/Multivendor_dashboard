<div class="container-fluid">
  <app-page-breadcrumb title="Line Charts" subTitle="Charts" />
  <div class="row">
    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Basic Line</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="basicLineChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Interpolation</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="interpolationChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Multi-Axes</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="multiAxesChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Point Styling</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="pointStyleChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Line Segment</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="lineSegmentChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Stepped</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="steppedChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->
  </div>
  <!-- end row-->
</div>
