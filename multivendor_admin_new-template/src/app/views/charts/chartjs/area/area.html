<div class="container-fluid">
  <app-page-breadcrumb title="Area Charts" subTitle="Charts" />
  <div class="row">
    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Basic Area</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="basicChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Different Dataset</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="differentDataSetChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Stacked</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="stackedChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Boundaries</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="boundaryChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Draw Time</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="drowTimeChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->
  </div>
  <!-- end row-->
</div>
