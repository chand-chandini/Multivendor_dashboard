<div class="container-fluid">
  <app-page-breadcrumb title="Bar Charts" subTitle="Charts" />
  <div class="row">
    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Basic Bar</h5>
        </div>
        <div class="card-body">
          <div dir="ltr">
            <div class="mt-3">
              <app-chartjs [getOptions]="basicBarChartOptions" style="max-height: 300px" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end col-->

    <div class="col-xl-6">
