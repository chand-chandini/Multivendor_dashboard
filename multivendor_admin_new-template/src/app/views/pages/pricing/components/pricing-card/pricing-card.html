<div class="card h-100 my-4 my-lg-0" [class]="{ 'text-bg-primary': plan.isPopular }">
  <div class="card-body p-lg-4 pb-0 text-center">
    <h3 class="fw-bold mb-1">{{ plan.name }}</h3>
    <p [class]="plan.isPopular ? 'text-white-50' : 'text-muted'">{{ plan.subtitle }}</p>

    <div class="my-4">
      <h1 class="display-6 fw-bold mb-0">{{ plan.price }}</h1>
      <small class="d-block fs-base" [class]="plan.isPopular ? 'text-white-50' : 'text-muted'"> {{ plan.billingText || ('Billed ' + plan.duration) }} </small>

      <small class="d-block" [class]="plan.isPopular ? 'text-white-50' : 'text-muted'"> {{ plan.planInfo }} </small>
    </div>

    <ul class="list-unstyled text-start fs-sm mb-0">
      @for (feature of plan.features; track $index) {
      <li class="mb-2">
        @if(feature.included){
        <app-icon icon="check" class="me-2 text-success"></app-icon>
        } @else{
        <app-icon icon="x" class="me-2 text-danger"> </app-icon>
        } {{ feature.title }}
      </li>
      }
    </ul>
  </div>
  <div class="card-footer bg-transparent px-5 pb-4">
    <a [routerLink]="plan.href || []" class="btn w-100 py-2 fw-semibold rounded-pill {{ plan.buttonClassName }}">{{ plan.buttonText }}</a>
  </div>
</div>
