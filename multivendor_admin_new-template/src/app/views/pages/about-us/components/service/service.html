<section class="py-5">
  <div class="container">
    <!-- Section Heading -->
    <div class="row">
      <div class="col-12 text-center">
        <span class="text-muted rounded-3 d-inline-block">💼 Tailored Solutions for Every Need</span>
        <h2 class="mt-3 fw-bold mb-5">
          Explore Our Professional
          <span class="text-primary">Services</span>
          and Expertise
        </h2>
      </div>
    </div>

    <!-- First Row of Service Cards -->
    <div class="row text-center">
      @for (service of featureData; track $index) {

      <div class="col-xl-4 col-md-6">
        <div class="card border-0 shadow-none p-2 card-h-100">
          <div class="card-body pb-0">
            <div class="avatar-xl mx-auto mb-3">
              <span class="avatar-title bg-secondary-subtle text-secondary rounded-circle fs-22">
                <app-icon [icon]="service.icon"></app-icon>
              </span>
            </div>

            <h4 class="mb-2">{{ service.title }}</h4>
            <p class="text-muted mb-3">{{ service.description }}</p>
          </div>

          <div class="card-footer border-0 pt-0">
            <a class="link-primary fw-semibold" [routerLink]="[]">
              Know more
              <app-icon icon="arrow-right" class="ms-1 align-middle"></app-icon>
            </a>
          </div>
        </div>
      </div>

      }
    </div>
  </div>
</section>
