<section class="border border-dashed p-5 pb-3 rounded bg-light bg-opacity-25">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <h3 class="fw-bold mb-5">
          Expanding Horizons.
          <span class="text-primary">Empowering</span>
          Futures
        </h3>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-4">
        <div class="card border-light p-2 card-h-100">
          <div class="card-body pb-0">
            <img src="assets/images/flags/us.svg" class="avatar-xl mb-3 rounded-circle" />
            <h4 class="fw-semibold mb-2">United States</h4>
            <p class="text-muted mb-3">
              501 Elm Street, Suite 500
              <br />
              New York, NY 10001
              <br />
              USA
            </p>
          </div>
          <div class="card-footer border-0 pt-0">
            <a class="link-primary fw-semibold" [routerLink]="[]">
              Contact Us
              <app-icon icon="arrow-right" class="ms-1 align-middle"></app-icon>
            </a>
          </div>
        </div>
      </div>

      <!-- UK Office -->
      <div class="col-xl-4">
        <div class="card border-light p-2 card-h-100">
          <div class="card-body pb-0">
            <img src="assets/images/flags/gb.svg" class="avatar-xl mb-3 rounded-circle" />
            <h4 class="fw-semibold mb-2">United Kingdom</h4>
            <p class="text-muted mb-3">
              221B Baker Street
              <br />
              London, NW1 6XE
              <br />
              United Kingdom
            </p>
          </div>
          <div class="card-footer border-0 pt-0">
            <a class="link-primary fw-semibold" [routerLink]="[]">
              Contact Us
              <app-icon icon="arrow-right" class="ms-1 align-middle"></app-icon>
            </a>
          </div>
        </div>
      </div>

      <!-- India Office -->
      <div class="col-xl-4">
        <div class="card border-light p-2 card-h-100">
          <div class="card-body pb-0">
            <img src="assets/images/flags/in.svg" class="avatar-xl mb-3 rounded-circle" />
            <h4 class="fw-semibold mb-2">India</h4>
            <p class="text-muted mb-3">
              15 MG Road, 2nd Floor
              <br />
              Bengaluru, Karnataka 560001
              <br />
              India
            </p>
          </div>
          <div class="card-footer border-0 pt-0">
            <a class="link-primary fw-semibold" [routerLink]="[]">
              Contact Us
              <app-icon icon="arrow-right" class="ms-1 align-middle"></app-icon>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
