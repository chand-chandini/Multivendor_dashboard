<div class="card mb-2">
  <div class="card-body">
    <div class="d-flex gap-3">
      <div class="avatar-lg rounded-circle text-bg-light d-flex align-items-center justify-content-center">
        <app-icon [icon]="leave.icon" class="fs-xxl"></app-icon>
      </div>
      <div class="flex-grow-1">
        <div class="mb-2 d-flex justify-content-between align-items-center">
          <h5 class="fs-xl mb-0">
            {{ leave.value }} @if (leave.unit) {
            <small class="fs-6">{{ leave.unit }}</small>
            }
          </h5>

          @if (leave.change !== undefined) {
          <span>
            {{ leave.change > 0 ? '+' : leave.change < 0 ? '' : '' }}{{ leave.change }}% @if(leave.change> 0){
            <app-icon icon="arrow-up" class="text-success"></app-icon>
            } @if(leave.change < 0){ <app-icon icon="arrow-down" class="text-danger"></app-icon>
            }
          </span>
          }
        </div>

        <p class="text-muted mb-0">{{ leave.title }}</p>
      </div>
    </div>
  </div>
</div>
