@for (item of activityData; track $index; let first = $first) {
<div class="d-flex gap-1 border-bottom border-dashed" [class]="first ? 'pb-3':'py-3'">
  <div class="me-2 flex-shrink-0">
    <img [src]="item.user.image" class="avatar-md rounded-circle" alt="" />
  </div>
  <div class="flex-grow-1 text-muted {{ item.message ? 'position-relative' : '' }}">
    <span class="fw-medium text-body">{{item.user.name}}</span>
    {{item.action}}
    <p class="fs-xs mb-0 text-body-secondary">{{item.datetime}}</p>

    @if (item.message) {
    <div class="py-2 px-3 bg-light bg-opacity-50 mt-2">"{{ item.message }}"</div>
    }
  </div>
  <p class="fs-xs text-body-secondary flex-shrink-0">{{item.time}}</p>
</div>
}

<div class="d-flex align-items-center justify-content-center gap-2 p-3">
  <strong>Loading...</strong>
  <div class="spinner-border spinner-border-sm text-danger" role="status" aria-hidden="true"></div>
</div>
