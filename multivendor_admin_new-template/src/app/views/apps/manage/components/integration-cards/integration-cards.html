<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div class="d-flex align-items-center gap-3">
        <img [src]="card.image" [alt]="card.name" width="48" height="48" class="rounded" />
        <div>
          <h5 class="card-title mb-1">{{ card.name }}</h5>
          <p class="text-muted mb-0">{{ card.description }}</p>
        </div>
      </div>

      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" checked />
      </div>
    </div>

    <div class="mb-3 d-flex flex-wrap gap-2">
      <span class="badge bg-light text-primary px-2 py-1 rounded-pill">{{ card.plan }}</span>
      <span class="badge bg-success-subtle text-success px-2 py-1 rounded-pill">{{ card.status }}</span>
      <span class="badge bg-info-subtle text-info px-2 py-1 rounded-pill">Sync: {{ card.syncTime }}</span>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <p class="fs-xxs text-uppercase fw-bold mb-0 text-muted">Connected Account</p>
        <span>{{ card.account }}</span>
      </div>
      <div class="col-md-6">
        <p class="fs-xxs text-uppercase fw-bold mb-0 text-muted">Last Sync</p>
        <span>{{ card.lastSync }}</span>
      </div>
    </div>

    <div class="mb-3">
      <div class="d-flex justify-content-between">
        <span class="mb-2 fw-bold fs-xs">Usage</span>
        <small class="fw-bold text-success">{{ card.usagePercent }}% of quota</small>
      </div>
      <ngb-progressbar [value]="card.usagePercent" type="success" [striped]="false" [animated]="false" height="6px"> </ngb-progressbar>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-outline-danger w-50">Remove</button>
      <button class="btn btn-outline-primary w-50" ngbTooltip="View integration details">Details</button>
    </div>
  </div>
</div>
