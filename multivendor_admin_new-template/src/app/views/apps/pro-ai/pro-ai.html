<div class="container-fluid">
  <app-page-breadcrumb title="Pro AI" subTitle="Apps"></app-page-breadcrumb>
  <div class="outlook-box gap-1">
    <ng-template #content let-offcanvas>
      <app-pro-ai-sidebar />
    </ng-template>

    <app-pro-ai-sidebar class="offcanvas-lg offcanvas-start outlook-left-menu rounded-start-4" />

    <ngx-simplebar class="card mb-0 rounded-0 flex-grow-1 outlook-right-menu-content">
      <div class="card-header d-lg-none d-flex">
        <button class="btn btn-sm btn-default btn-icon" type="button" (click)="openSidebar(content)">
          <app-icon icon="menu-4" class="fs-lg"></app-icon>
        </button>
      </div>

      <div class="card-body d-flex flex-column justify-content-between align-items-center h-100">
        <div class="row justify-content-center">
          <div class="col-xl-8">
            <div class="mt-3">
              <div class="avatar avatar-sm rounded-circle mx-auto text-bg-dark">
                <span class="avatar-title">
                  <app-icon icon="sparkles" class="fs-md"></app-icon>
                </span>
              </div>
              <h3 class="mb-4 mt-2 text-center">How can I help, {{ username }} 👋?</h3>

              <div class="py-4">
                <div class="row g-2">
                  @for (item of featureData; track $index) {
                  <div class="col-md-4">
                    <div class="card card-h-100 rounded-3 shadow-none bg-light-subtle border border-dashed">
                      <div class="card-body">
                        <div class="avatar-lg mb-2 rounded-circle text-bg-light d-flex align-items-center justify-content-center">
                          @if(item.icon) {
                          <app-icon [icon]="item.icon" class="fs-xxl"></app-icon>
                          }
                        </div>
                        <p class="mb-0 text-muted">{{item.title}}</p>
                        <a [routerLink]="item.href || []" class="stretched-link"></a>
                      </div>
                    </div>
                  </div>
                  }
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="w-100 text-center">
          <div class="card-body">
            <textarea class="form-control" id="exampleFormControlTextarea1" rows="4" placeholder="Enter message"></textarea>
            <div class="d-flex gap-1 mt-2 align-items-center">
              <button type="button" class="btn btn-sm btn-icon btn-default" ngbTooltip="Attach files" placement="top">
                <app-icon icon="paperclip" class="fs-sm"></app-icon>
              </button>
              <button type="button" class="btn btn-sm btn-icon btn-default" ngbTooltip="Insert link" placement="top">
                <app-icon icon="link" class="fs-sm"></app-icon>
              </button>
              <button type="button" class="btn btn-sm btn-icon btn-default" ngbTooltip="Insert photo" placement="top">
                <app-icon icon="photo-up" class="fs-sm"></app-icon>
              </button>
              <button type="button" class="btn btn-sm btn-icon btn-default" ngbTooltip="Voice" placement="top">
                <app-icon icon="microphone" class="fs-sm"></app-icon>
              </button>
              <button type="button" class="btn btn-sm btn-primary ms-auto">
                <app-icon icon="send-2" class="fs-sm me-1"></app-icon>
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
    </ngx-simplebar>
  </div>
  <!-- end row-->
</div>
