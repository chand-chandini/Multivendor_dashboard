<div class="card rounded-0 mb-0">
  <ngx-simplebar class="card-body p-0 outlook-left-menu-content">
    <div class="chat-sidebar p-3">
      <!-- Top Actions -->
      <div class="mb-4">
        <div class="list-group list-group-flush list-custom">
          @for (item of mainMenuData; track $index) {
          <a [routerLink]="item.href || []" class="list-group-item list-group-item-action d-flex align-items-center gap-2" [class.active]="item.active">
            @if(item.icon){
            <app-icon [icon]="item.icon" class="fs-md"></app-icon>
            } {{item.label}}
          </a>
          }
        </div>
      </div>

      <!-- Workspace Folders -->
      <div class="mb-3">
        <h6 class="text-muted text-uppercase fs-xs mb-2">Workspaces</h6>
        <div class="list-group list-group-flush list-custom">
          @for (item of workspaceData; track $index) {
          <a [routerLink]="item.href || []" class="list-group-item list-group-item-action d-flex align-items-center gap-2">
            @if(item.icon){
            <app-icon [icon]="item.icon" class="fs-md"></app-icon>
            } {{item.label}}
          </a>

          }
        </div>
      </div>

      <!-- Recent Chats -->
      <div>
        <h6 class="text-muted text-uppercase fs-xs mb-2">Recent Conversations</h6>
        <div class="list-group list-group-flush list-custom">
          @for (item of conversationData; track $index) {
          <a [routerLink]="item.href || []" class="list-group-item list-group-item-action text-body py-1">{{item.label}}</a>
          }
        </div>
      </div>
    </div>
  </ngx-simplebar>
  <!-- end card-body-->
</div>
