<div class="card card-top-sticky">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center rounded border-light p-2 bg-light-subtle border">
      <div class="d-flex justify-content-start align-items-center gap-3">
        <div class="avatar avatar-xl">
          <img src="assets/images/sellers/1.png" alt="avatar-store" class="img-fluid rounded-circle" />
        </div>
        <div>
          <h5 class="text-nowrap fw-bold mb-1">MacHub Retailers</h5>
          <p class="text-muted mb-0">Since 2017</p>
        </div>
      </div>
      <div ngbDropdown class="d-flex gap-2" placement="bottom-end">
        <button class="btn btn-sm btn-icon btn-light drop-arrow-none" ngbDropdownToggle>
          <app-icon icon="dots" class="fs-24"></app-icon>
        </button>
        <ul class="dropdown-menu-end" ngbDropdownMenu>
          <li><a [routerLink]="[]" ngbDropdownItem>Edit Profile</a></li>
          <li><a class="text-danger" [routerLink]="[]" ngbDropdownItem>Report</a></li>
        </ul>
      </div>
    </div>

    <div class="mt-3">
      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
          <app-icon icon="user" class="fs-xl text-muted"></app-icon>
        </div>
        <p class="mb-0 fs-sm">Owner: <span class="fw-semibold">Sophie Martinez</span></p>
      </div>

      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
          <app-icon icon="briefcase" class="fs-xl text-muted"></app-icon>
        </div>
        <p class="mb-0 fs-sm">Business Type: <span class="fw-semibold">Fashion Retail</span></p>
      </div>

      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
          <app-icon icon="calendar-event" class="fs-xl text-muted"></app-icon>
        </div>
        <p class="mb-0 fs-sm">Founded: <span class="fw-semibold">2015</span></p>
      </div>

      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
          <app-icon icon="map-pin" class="fs-xl text-muted"></app-icon>
        </div>
        <p class="mb-0 fs-sm">Location: <span class="fw-semibold">Los Angeles, USA</span></p>
      </div>

      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
          <app-icon icon="mail" class="fs-xl text-muted"></app-icon>
        </div>
        <p class="mb-0 fs-sm">
          Support:
          <a href="mailto:help@stylehub.com" class="text-primary fw-semibold">help@stylehub.com</a>
        </p>
      </div>

      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
          <app-icon icon="world" class="fs-xl text-muted"></app-icon>
        </div>
        <p class="mb-0 fs-sm">
          Website:
          <a href="https://www.stylehub.com" class="text-primary fw-semibold">www.stylehub.com</a>
        </p>
      </div>
    </div>
  </div>

  <div class="card-body border-top border-dashed">
    <h5 class="mb-3">Contact Seller</h5>
    <form>
      <div class="mb-3">
        <textarea class="form-control" id="exampleFormControlTextarea1" rows="4" placeholder="Enter your messages..."></textarea>
      </div>
      <div class="text-end">
        <button type="submit" class="btn btn-primary">Send Messages</button>
      </div>
    </form>
  </div>
</div>
