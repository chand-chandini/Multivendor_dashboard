<div class="card mb-1">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
      <h3 class="mb-0" [countUp]="item.value" [countUpOptions]="{prefix: item.prefix || '', suffix: item.suffix || '',decimalPlaces: Number.isInteger(item.value) ? 0 : 2}">{{ item.value }}</h3>
      <div class="avatar-md flex-shrink-0">
        <span class="avatar-title rounded-circle fs-22" [class]="item.className">
          <app-icon [icon]="item.icon"></app-icon>
        </span>
      </div>
    </div>
    <p class="mb-0 text-uppercase fs-xs fw-bold">
      {{item.title}}
      <span class="float-end badge" [class]="{'badge-soft-success': item.change >= 0,'badge-soft-danger': item.change < 0 }"> {{ item.change >= 0 ? '+': '' }}{{ item.change }}%</span>
    </p>
  </div>
</div>
