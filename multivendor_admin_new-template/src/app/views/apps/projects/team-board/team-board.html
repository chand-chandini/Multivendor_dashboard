<div class="container-fluid">
  <div class="row">
    <div class="col-xxl-12">
      <div class="d-flex align-items-sm-center flex-sm-row flex-column my-3">
        <div class="flex-grow-1">
          <h4 class="fs-xl mb-1">Manage Teams</h4>
          <p class="text-muted mb-0">Assign roles to streamline teamwork and secure access.</p>
        </div>

        <div class="text-end">
          <a [routerLink]="[]" (click)="openModal(content)" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addTeamModal">
            <app-icon icon="plus" class="me-1"></app-icon>
            Add New Team
          </a>
        </div>
      </div>

      <div class="row">
        @for (team of teamData; track $index) {
        <div class="col-md-6 col-lg-4">
          <app-team-board-card [team]="team" />
        </div>
        }
      </div>
    </div>
  </div>
</div>

<ng-template #content let-modal>
  <div class="modal-header">
    <h5 class="modal-title fw-semibold">Add New Team</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <form id="teamForm">
      <!-- Team Name -->
      <div class="mb-3">
        <label class="form-label">Team Name</label>
        <input type="text" class="form-control" placeholder="e.g., Creative Design Team" required />
      </div>

      <!-- Team Code / Short Label -->
      <div class="mb-3">
        <label class="form-label">Team Code</label>
        <input type="text" class="form-control" placeholder="e.g., IT-01" required />
      </div>

      <!-- Team Status -->
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select">
          <option value="new" selected>New</option>
          <option value="active">Active</option>
          <option value="ongoing">Ongoing</option>
          <option value="busy">Busy</option>
          <option value="stable">Stable</option>
        </select>
      </div>

      <!-- Members -->
      <div class="mb-3">
        <label class="form-label">Team Members</label>
        <select class="form-select" multiple>
          <option value="1">Liam Carter</option>
          <option value="2">Ava Mitchell</option>
          <option value="3">Noah Parker</option>
          <option value="4">Emma Scott</option>
          <option value="5">Logan Brooks</option>
          <option value="6">Sophie Adams</option>
          <option value="7">Ethan Hall</option>
        </select>
        <div class="form-text">Hold Ctrl (Windows) or Cmd (Mac) to select multiple users.</div>
      </div>

      <!-- Description -->
      <div class="mb-0">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="3" placeholder="Brief team responsibilities..."></textarea>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <button class="btn btn-light" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-success">
      <app-icon icon="check" class="me-1"></app-icon>
      Save Team
    </button>
  </div>
</ng-template>
