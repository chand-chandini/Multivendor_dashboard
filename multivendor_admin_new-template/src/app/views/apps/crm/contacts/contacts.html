<div class="container-fluid">
  <app-page-breadcrumb title="Contacts" subTitle="CRM" />

  <div class="row">
    @for (contact of contactData; track $index) {
    <div class="col-md-6 col-xxl-4">
      <app-contact-card [item]="contact" />
    </div>
    }
  </div>

  <ul class="pagination pagination-rounded pagination-boxed justify-content-center">
    <ngb-pagination [page]="1" [collectionSize]="50" />
  </ul>
</div>
