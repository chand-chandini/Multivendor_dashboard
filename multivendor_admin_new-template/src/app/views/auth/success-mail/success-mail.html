<div class="position-absolute top-0 end-0">
  <img src="assets/images/auth-card-bg.svg" class="auth-card-bg-img" alt="auth-card-bg" />
</div>
<div class="position-absolute bottom-0 start-0" style="transform: rotate(180deg)">
  <img src="assets/images/auth-card-bg.svg" class="auth-card-bg-img" alt="auth-card-bg" />
</div>
<div class="auth-box overflow-hidden align-items-center d-flex">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xxl-5 col-md-6 col-sm-8">
        <div class="card p-4">
          <div class="auth-brand text-center mb-3">
            <a routerLink="/" class="logo-dark">
              <img src="assets/images/logo-black.png" alt="dark logo" />
            </a>
            <a routerLink="/" class="logo-light">
              <img src="assets/images/logo.png" alt="logo" />
            </a>
            <p class="text-muted w-lg-75 mt-3 mx-auto">Awesome! You’ve read the important message like a pro.</p>
          </div>

          <form>
            <div class="mb-4">
              <div class="avatar-xxl mx-auto mt-2">
                <div class="avatar-title bg-light-subtle border border-light border-dashed rounded-circle">
                  <img src="assets/images/checkmark.png" alt="dark logo" height="64" />
                </div>
              </div>
            </div>

            <h4 class="fw-bold text-center mb-4">Well Done! Email verified Successfully</h4>

            <div class="d-grid">
              <a routerLink="/" class="btn btn-primary fw-semibold py-2">Bake to Dashboard</a>
            </div>
          </form>
        </div>

        <p class="text-center text-muted mt-4 mb-0">
          © {{ currentYear }} {{ name }} — by
          <span class="fw-semibold">{{ author }}</span>
        </p>
      </div>
    </div>
  </div>
</div>
