<div class="container-fluid">
  <app-page-breadcrumb title="Charts" subTitle="Widgets" />
  <div class="row">
    @for (item of statData; track $index) {
    <div class="col-md-6 col-xxl-3">
      <app-statistic-card1 [item]="item" [index]="$index" />
    </div>
    }
  </div>

  <div class="row row-cols-xxl-4 row-cols-md-2 row-cols-1">
    @for (item of revenueStatisticData.slice(0, 4); track $index; let i = $index) {
    <div class="col">
      @if (i % 2 === 0) {
      <app-statistic-widget-chart-right [item]="item" />
      } @else {
      <app-statistic-widget-chart-left [item]="item" />
      }
    </div>
    }
  </div>

  <div class="row">
    <div class="col-xxl-3 col-xl-6">
      <app-project-status />
    </div>
    <div class="col-xxl-3 col-xl-6 order-xxl-1">
      <app-store-performance />
    </div>
    <div class="col-xxl-6 col-xl-12">
      <app-projects-performance />
    </div>
  </div>
  <div class="row">
    <div class="col-xxl-6">
      <app-sales-report />
    </div>

    <div class="col-xxl-6">
      <app-financial-overview />
    </div>
  </div>
</div>
