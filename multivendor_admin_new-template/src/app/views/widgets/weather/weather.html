<div class="container-fluid">
  <app-page-breadcrumb title="Weather" subTitle="Widgets" />
  <div class="row row-cols-xxl-5 row-cols-md-3 row-cols-1 g-2 text-center align-items-center">
    @for (item of weatherStatData; track $index) {
    <div class="col">
      <app-statistic-card1 [item]="item" />
    </div>
    }
  </div>

  <div class="row">
    @for (item of weatherData; track $index) {
    <div class="col-xl-6">
      <app-statistic-card2 [item]="item" />
    </div>
    }
  </div>

  <div class="row">
    <div class="col-xxl-4 col-xl-12">
      <app-top-cities-weather />
    </div>

    <div class="col-xxl-4 col-xl-6">
      <app-weather-by-country />
    </div>

    <div class="col-xxl-4 col-xl-6">
      <app-statistic-card3 />

      <app-statistic-card4 />
    </div>
  </div>
</div>
