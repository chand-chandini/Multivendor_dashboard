<div class="card">
  <div class="card-body pb-0 d-flex align-items-center">
    <img src="assets/images/users/user-10.jpg" class="avatar-md rounded-circle me-2" />

    <div class="flex-grow-1">
      <h5 class="fw-semibold mb-0"><a [routerLink]="[]" class="link-reset">Evelyn Brooks</a></h5>
      <small class="text-muted">Just now</small>
    </div>

    <div ngbDropdown placement="bottom-end">
      <a ngbDropdownToggle [routerLink]="[]" class="text-muted drop-arrow-none">
        <app-icon icon="dots-vertical" class="fs-lg"></app-icon>
      </a>
      <ul ngbDropdownMenu class="dropdown-menu-end">
        <li>
          <a ngbDropdownItem [routerLink]="[]"><app-icon icon="flag" class="me-2"></app-icon>Report</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="px-3 pb-3 pt-2">
    <div class="bg-primary bg-opacity-10 text-primary rounded-3 p-4 text-center">
      <h1 class="display-6 mb-0">🌤️</h1>
      <h3 class="fw-bold mb-2">23°C</h3>
      <p class="mb-0 fst-italic">Clear skies in <strong>Vancouver</strong></p>
    </div>

    <p class="mt-3 text-muted text-center">Perfect weather for a walk by the water today 🌊✨</p>
  </div>

  <!-- Footer -->
  <div class="card-footer border-0 pt-0 d-flex justify-content-center gap-2">
    <span class="btn btn-sm fs-sm btn-link text-muted" (click)="toggleLike()">
      @if (liked) {
      <span class="align-middle">
        <app-icon icon="heart-filled" class="text-danger"></app-icon>
        Liked!
      </span>
      } @else {
      <span class="align-middle">
        <app-icon icon="heart" class="text-muted"></app-icon>
        Like
      </span>
      }
    </span>

    <a [routerLink]="[]" class="btn btn-sm fs-sm btn-link text-muted"><app-icon icon="corner-up-left" class="me-1"></app-icon>Comment</a>
    <a [routerLink]="[]" class="btn btn-sm fs-sm btn-link text-muted"><app-icon icon="share" class="me-1"></app-icon>Share</a>
  </div>
</div>
<!-- end card-->
