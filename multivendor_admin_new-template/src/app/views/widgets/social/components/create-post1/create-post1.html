<div class="card">
  <div class="card-body">
    <h5 class="mb-2">What's on your mind?</h5>

    <form>
      <textarea rows="3" class="form-control" placeholder="Share your thoughts..."></textarea>

      <div class="d-flex pt-2 justify-content-between align-items-center">
        <div class="d-flex gap-1">
          <a [routerLink]="[]" class="btn btn-sm btn-icon btn-light">
            <app-icon icon="user" class="fs-md"></app-icon>
          </a>
          <a [routerLink]="[]" class="btn btn-sm btn-icon btn-light">
            <app-icon icon="map-pin" class="fs-md"></app-icon>
          </a>
          <a [routerLink]="[]" class="btn btn-sm btn-icon btn-light">
            <app-icon icon="camera" class="fs-md"></app-icon>
          </a>
          <a [routerLink]="[]" class="btn btn-sm btn-icon btn-light">
            <app-icon icon="mood-smile" class="fs-md"></app-icon>
          </a>
        </div>

        <button type="submit" class="btn btn-dark btn-sm">Post</button>
      </div>
    </form>
  </div>
</div>
