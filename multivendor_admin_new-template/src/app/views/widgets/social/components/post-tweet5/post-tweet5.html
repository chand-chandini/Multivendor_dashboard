<div class="card">
  <div class="card-body pb-0">
    <div class="d-flex align-items-center">
      <img src="assets/images/users/user-6.jpg" class="avatar-sm rounded-circle me-2" alt="User" />

      <!-- User Info -->
      <div class="flex-grow-1">
        <h5 class="fw-semibold mb-0">
          <a [routerLink]="[]" class="link-reset">David Kim</a>
        </h5>
        <small class="text-muted">10 hours ago</small>
      </div>

      <!-- Dropdown -->
      <div ngbDropdown placement="bottom-end">
        <a ngbDropdownToggle [routerLink]="[]" class="text-muted drop-arrow-none">
          <app-icon icon="dots-vertical" class="fs-lg"></app-icon>
        </a>
        <ul ngbDropdownMenu class="dropdown-menu-end">
          <li>
            <a ngbDropdownItem [routerLink]="[]"><app-icon icon="edit" class="me-2"></app-icon>Edit Post</a>
          </li>
          <li>
            <a ngbDropdownItem [routerLink]="[]"><app-icon icon="trash" class="me-2"></app-icon>Delete Post</a>
          </li>
          <li>
            <a ngbDropdownItem [routerLink]="[]"><app-icon icon="share" class="me-2"></app-icon>Share</a>
          </li>
          <li>
            <a ngbDropdownItem [routerLink]="[]"><app-icon icon="pin" class="me-2"></app-icon>Pin to Top</a>
          </li>
          <li>
            <a ngbDropdownItem [routerLink]="[]"><app-icon icon="flag" class="me-2"></app-icon>Report Post</a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Poll Title -->
    <div class="mt-3">
      <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill mb-2">📊 Community Poll</span>
      <h5 class="fw-bold mb-1">Choose your favorite front-end framework in 2025</h5>
      <p class="text-muted mb-2">Your vote helps us decide what to adopt for our next UI toolkit update.</p>
    </div>
  </div>

  <!-- Poll Section -->
  <div class="px-3 pb-3">
    <div class="bg-light-subtle p-3 ps-4 rounded-3 border">
      <!-- Poll Options -->
      <form class="poll-form">
        <div class="form-check mb-2 p-2 card-bg rounded-3 shadow-sm">
          <input class="form-check-input" type="radio" name="poll" id="pollReact" />
          <label class="form-check-label fw-semibold" for="pollReact"> React (Meta) </label>
        </div>

        <div class="form-check mb-2 p-2 card-bg rounded-3 shadow-sm">
          <input class="form-check-input" type="radio" name="poll" id="pollVue" />
          <label class="form-check-label fw-semibold" for="pollVue"> Vue.js (Evan You) </label>
        </div>

        <div class="form-check mb-2 p-2 card-bg rounded-3 shadow-sm">
          <input class="form-check-input" type="radio" name="poll" id="pollAngular" />
          <label class="form-check-label fw-semibold" for="pollAngular"> Angular (Google) </label>
        </div>

        <div class="form-check mb-3 p-2 card-bg rounded-3 shadow-sm">
          <input class="form-check-input" type="radio" name="poll" id="pollSvelte" />
          <label class="form-check-label fw-semibold" for="pollSvelte"> Svelte (Emerging Favorite) </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 rounded-pill">Submit Vote</button>
      </form>
    </div>
  </div>
</div>
