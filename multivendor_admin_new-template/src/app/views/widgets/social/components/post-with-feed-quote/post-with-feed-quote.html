<div class="card overflow-hidden">
  <!-- Background Quote Block -->
  <div class="position-relative">
    <img src="assets/images/gallery/12.jpg" class="img-fluid w-100" style="height: 200px; object-fit: cover; filter: brightness(0.5)" />

    <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center text-center text-white px-4">
      <app-icon icon="quote" class="fs-1 opacity-75 mb-2"></app-icon>
      <h4 class="fw-bold mb-1">“Creativity is intelligence having fun.”</h4>
      <p class="small mb-0 opacity-75">A reminder to keep exploring, learning, and building.</p>
    </div>

    <!-- Dropdown -->
    <div ngbDropdown class="position-absolute top-0 end-0 m-3">
      <a ngbDropdownToggle [routerLink]="[]" class="text-white drop-arrow-none">
        <app-icon icon="dots-vertical" class="fs-lg"></app-icon>
      </a>
      <ul ngbDropdownMenu class="dropdown-menu-end">
        <li>
          <a ngbDropdownItem [routerLink]="[]"><app-icon icon="share" class="me-2"></app-icon>Share</a>
        </li>
        <li>
          <a ngbDropdownItem [routerLink]="[]"><app-icon icon="flag" class="me-2"></app-icon>Report</a>
        </li>
      </ul>
    </div>
  </div>

  <!-- User Footer -->
  <div class="card-body d-flex align-items-center">
    <img src="assets/images/users/user-4.jpg" class="avatar-md rounded-circle me-2" />

    <div class="flex-grow-1">
      <h5 class="fw-semibold mb-0"><a [routerLink]="[]" class="link-reset">Noah Carter</a></h5>
      <small class="text-muted">Shared an inspiration</small>
    </div>

    <span class="text-muted fs-xl" (click)="toggleLike()">
      @if (liked) {
      <span class="align-middle">
        <app-icon icon="heart-filled" class="text-danger"></app-icon>
      </span>
      } @else {
      <span class="align-middle">
        <app-icon icon="heart" class="text-muted"></app-icon>
      </span>
      }
    </span>
  </div>
</div>
