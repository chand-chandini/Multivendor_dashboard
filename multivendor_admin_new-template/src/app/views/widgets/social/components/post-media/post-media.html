<div class="card">
  <!-- Header -->
  <div class="card-body pb-0 d-flex align-items-center">
    <img src="assets/images/users/user-7.jpg" class="avatar-sm rounded-circle me-2" />
    <div class="flex-grow-1">
      <h5 class="fw-semibold mb-0"><a [routerLink]="[]" class="link-reset">Ava Thompson</a></h5>
      <small class="text-muted">1 hour ago</small>
    </div>
    <div ngbDropdown placement="bottom-end">
      <a ngbDropdownToggle [routerLink]="[]" class="text-muted drop-arrow-none">
        <app-icon icon="dots-vertical" class="fs-lg"></app-icon>
      </a>
      <ul ngbDropdownMenu class="dropdown-menu-end">
        <li>
          <a ngbDropdownItem [routerLink]="[]"><app-icon icon="share" class="me-2"></app-icon>Share</a>
        </li>
        <li>
          <a ngbDropdownItem [routerLink]="[]"><app-icon icon="flag" class="me-2"></app-icon>Report</a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Story Image -->
  <div class="p-3 pb-0">
    <div class="rounded-4 overflow-hidden shadow-sm">
      <img src="assets/images/gallery/8.jpg" class="img-fluid w-100" style="height: 260px; object-fit: cover" />
    </div>
  </div>

  <!-- Caption -->
  <div class="px-3 py-2">
    <p class="mb-2 text-muted">Dropping my favorite shot from yesterday's sunset hike. 🌅 Nature always surprises me.</p>
  </div>

  <!-- Actions -->
  <div class="p-2">
    <a [routerLink]="[]" class="btn btn-sm fs-sm btn-link text-muted">
      <app-icon icon="corner-up-left" class="me-1"></app-icon>
      Reply
    </a>
    <span class="btn btn-sm fs-sm btn-link text-muted" (click)="toggleLike()">
      @if (liked) {
      <span class="align-middle">
        <app-icon icon="heart-filled" class="text-danger"></app-icon>
        Liked!
      </span>
      } @else {
      <span class="align-middle">
        <app-icon icon="heart" class="text-muted"></app-icon>
        Like
      </span>
      }
    </span>
    <a [routerLink]="[]" class="btn btn-sm fs-sm btn-link text-muted">
      <app-icon icon="share" class="me-1"></app-icon>
      Share
    </a>
  </div>
</div>
