<div class="card">
  <div class="card-body">
    <div class="d-flex gap-3">
      <div class="avatar-lg rounded-circle text-bg-light d-flex align-items-center justify-content-center">
        <app-icon [icon]="item.icon" class="fs-xxl"></app-icon>
      </div>
      <div class="flex-grow-1">
        <div class="mb-3 d-flex justify-content-between align-items-center">
          <h5 class="fs-xl mb-0">{{ item.prefix }}{{item.value}} @if(item.suffix){<small class="fs-6"> {{ item.suffix }} </small> }</h5>
          <span>
            {{ item.change }}% @if(item.change> 0){
            <app-icon icon="arrow-up" class="text-success"></app-icon>
            } @if(item.change < 0){ <app-icon icon="arrow-down" class="text-danger"></app-icon> }
          </span>
        </div>
        <p class="text-muted mb-2">{{ item.title }}</p>
        <ngb-progressbar [value]="item.progress" [type]="item.variant" class="mb-0 progress-sm"></ngb-progressbar>
      </div>
    </div>
  </div>
</div>
