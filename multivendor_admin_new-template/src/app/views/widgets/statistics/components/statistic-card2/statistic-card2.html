<div class="col border-end border-light border-dashed">
  <div class="mt-3 mt-md-0 p-3">
    <h5 class="text-muted fs-13 text-uppercase" title="Number of Orders">{{item.title}}</h5>
    <div class="d-flex align-items-center justify-content-center gap-2 my-3">
      <div class="avatar-sm flex-shrink-0">
        <span class="avatar-title rounded-circle fs-22" [class]="item.className">
          <app-icon [icon]="item.icon"></app-icon>
        </span>
      </div>
      <h3 class="mb-0 fw-bold">
        <span
          [countUp]="item.value"
          [countUpOptions]="{
                 prefix: item.prefix || '',
                   suffix: item.suffix || '',
                    decimalPlaces: Number.isInteger(item.value) ? 0 : 2
                  }"
        ></span>
      </h3>
    </div>
    <p class="mb-0 text-muted">
      <span class="me-2" [class]="item.change > 0 ? 'text-success' : 'text-danger'">
        @if(item.change > 0){
        <app-icon icon="chevron-up" class="text-success"></app-icon>
        } @else{ <app-icon icon="chevron-down" class="text-danger"></app-icon> }{{ item.change }}%</span
      >
      <span class="text-nowrap">Since last month</span>
    </p>
  </div>
</div>
