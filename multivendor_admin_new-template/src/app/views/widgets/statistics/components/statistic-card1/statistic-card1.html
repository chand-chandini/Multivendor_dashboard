<div class="row">
  <div class="col-md-6 col-xxl-3">
    <div class="card card-h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <div>
            <h5 class="text-muted fs-base text-uppercase" title="Total Orders">Total Orders</h5>
            <h3 class="my-2 py-1 fw-semibold"><span [countUp]="12540"></span></h3>
            <p class="mb-0 text-muted">
              <span class="text-success me-2"><app-icon icon="arrow-up"></app-icon> 3.2%</span>
              Since last month
            </p>
          </div>
          <div class="avatar-lg flex-shrink-0">
            <span class="avatar-title bg-primary-subtle rounded fs-22">
              <app-icon icon="shopping-cart" class="text-primary"></app-icon>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- New Customers -->
  <div class="col-md-6 col-xxl-3">
    <div class="card bg-info-subtle border-info border-opacity-25 card-h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <div>
            <h5 class="text-muted fs-base text-uppercase" title="New Customers">New Customers</h5>
            <h3 class="my-2 py-1 fw-semibold"><span [countUp]="1284"></span></h3>
            <p class="mb-0 text-muted">
              <span class="text-success me-2"><app-icon icon="arrow-up"></app-icon> 6.1%</span>
              Since last month
            </p>
          </div>
          <div class="avatar-lg flex-shrink-0">
            <span class="avatar-title text-bg-info rounded-circle fs-22">
              <app-icon icon="users"></app-icon>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Revenue -->
  <div class="col-md-6 col-xxl-3">
    <div class="card text-bg-primary card-h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <div>
            <h5 class="text-white-50 fs-base text-uppercase" title="Total Revenue">Revenue</h5>
            <h3 class="my-2 py-1 fw-semibold">$<span [countUp]="98.40" [countUpOptions]="{ duration: 2, decimalPlaces: 2 }"></span>k</h3>
            <p class="mb-0 text-white-50">
              <span class="text-white me-2"><app-icon icon="arrow-down"></app-icon> 2.9%</span>
              Since last month
            </p>
          </div>
          <div class="avatar-lg flex-shrink-0">
            <span class="avatar-title bg-white bg-opacity-25 rounded fs-22">
              <app-icon icon="pig-money" class="text-white"></app-icon>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Conversion Rate -->
  <div class="col-md-6 col-xxl-3">
    <div class="card card-h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <div>
            <h5 class="text-muted fs-base text-uppercase" title="Conversion Rate">Conversion Rate</h5>
            <h3 class="my-2 py-1 fw-semibold"><span [countUp]="4.76" [countUpOptions]="{ duration: 2, decimalPlaces: 2 }"></span>%</h3>
            <p class="mb-0 text-muted">
              <span class="text-success me-2"><app-icon icon="arrow-up"></app-icon> 1.4%</span>
              Since last month
            </p>
          </div>
          <div class="avatar-lg flex-shrink-0">
            <span class="avatar-title bg-primary-subtle rounded fs-22">
              <app-icon icon="trending-up" class="text-primary"></app-icon>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
