<div class="container-fluid">
  <app-page-breadcrumb title="Mixed" subTitle="Widgets" />

  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-5">
    @for (item of targetData; track $index) {
    <div class="col">
      <app-statistic-card1 [item]="item" />
    </div>
    }
  </div>
  <!-- end row-->

  <div class="row">
    <div class="col-xxl-4 col-xl-6">
      <app-visitors />
    </div>

    <div class="col-xxl-4 col-xl-6">
      <app-subscribers />
    </div>

    <div class="col-xxl-4">
      <app-top-traffic-sources />
    </div>
  </div>
  <!-- end row-->

  <div class="row">
    @for (item of overviewData; track $index) {
    <div class="col-xl-4">
      <app-statistic-card2 [item]="item" />
    </div>
    }
  </div>

  <div class="row">
    @for (item of userData; track $index) {
    <div class="col-md-6 col-xxl-3">
      <app-user-card [item]="item" />
    </div>
    }
  </div>

  <div class="row">
    <div class="col-xl-4">
      <app-chat />
    </div>

    <div class="col-xxl-4 col-lg-6">
      <app-traffic-sources />
    </div>

    <div class="col-xxl-4 col-lg-6">
      <app-top-countries />
    </div>
  </div>
  <!-- end row-->

  <div class="row">
    <div class="col-xxl-7">
      <div class="row">
        <div class="col-xl-6">
          <app-channels />
        </div>

        <div class="col-xl-6">
          <app-project-card />
        </div>
      </div>
    </div>
    <div class="col-xxl-5">
      <app-search />
    </div>
  </div>
  <!-- end row-->
</div>
