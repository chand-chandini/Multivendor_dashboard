<div class="card bg-gradient border-0" [class]="'bg-' + item.variant">
  <div
    class="card-body"
    [ngStyle]="{
    'background-image': 'url(' + item.image + ')',
    'background-size': 'contain',
    'background-repeat': 'no-repeat',
    'background-position': 'right bottom'
  }"
  >
    <h4 class="text-white">{{ item.title }}</h4>
    <p class="text-white text-opacity-75">{{ item.description }}</p>
    <div class="d-flex gap-1">
      @for (action of item.actions; track $index) {
      <a [routerLink]="action.href || '[]'" class="btn btn-sm bg-white bg-opacity-10" [class]="'btn-' + item.variant">
        <iconify-icon [icon]="action.icon"></iconify-icon>
        @if (action.label) {
        <span class="ms-1">{{ action.label }}</span>
        }
      </a>
      }
    </div>
  </div>
</div>
