<div class="card">
  <div class="card-header">
    <h4 class="card-title">Channels</h4>
  </div>
  <div class="card-body">
    @for (item of channelData; track $index) {
    <div class="d-flex justify-content-between align-items-center mb-1">
      <div class="d-flex align-items-center gap-2">
        <img [src]="item.image" [alt]="item.name" class="avatar-xxs rounded" />
        <span>{{ item.name }}</span>
      </div>
      <span class="fw-semibold">{{ item.progress }}%</span>
    </div>
    <ngb-progressbar type="success" [value]="item.progress" class="progress-md mb-3" />
    }
    <button class="btn btn-primary w-100 mt-2">Download Reports</button>
  </div>
</div>
<!-- end card-->

<div class="card bg-secondary bg-gradient border-0">
  <div class="card-body" style="background-image: url(assets/images/flower-style.svg); background-size: contain; background-repeat: no-repeat; background-position: right bottom">
    <h5 class="mb-1 text-white fw-semibold">Company Contact</h5>
    <p class="text-white text-opacity-75 mb-3">Get in touch with our support team.</p>

    <div class="mb-2 text-white text-opacity-75">
      <iconify-icon icon="tabler:mail" class="me-2 text-white"></iconify-icon>
      support@company.com
    </div>

    <div class="mb-2 text-white text-opacity-75">
      <iconify-icon icon="tabler:phone" class="me-2 text-white"></iconify-icon>
      +1 (234) 567-890
    </div>

    <a href="mailto:support@company.com" class="btn btn-light w-100"> Contact Support </a>
  </div>
</div>
